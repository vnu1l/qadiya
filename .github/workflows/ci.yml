name: QADIYA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce continuity worklog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE"
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "${BASE_SHA:-}" ]]; then
            echo "No comparison base available; skipping continuity gate for initial commit."
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          printf '%s\n' "$CHANGED"

          if printf '%s\n' "$CHANGED" | grep -Eq '^(apps/|packages/|Dockerfile$|package\.json$|pnpm-workspace\.yaml$|tsconfig\.base\.json$)'; then
            if ! printf '%s\n' "$CHANGED" | grep -Fxq 'docs/WORKLOG.md'; then
              echo '::error::Source/game/deployment architecture changed without an append-only docs/WORKLOG.md entry. Read AGENTS.md and document what changed, why, remaining risks, and the next exact step.'
              exit 1
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build production container
        run: docker build --tag qadiya-ci:${GITHUB_SHA} .

      - name: Smoke frontend and backend from the same container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name qadiya-ci -p 2567:2567 -e PORT=2567 -e GIT_COMMIT_SHA="$GITHUB_SHA" qadiya-ci:${GITHUB_SHA}
          trap 'docker rm -f qadiya-ci >/dev/null 2>&1 || true' EXIT

          healthy=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:2567/health > /tmp/qadiya-health.json; then
              healthy=1
              break
            fi
            sleep 1
          done

          if [[ "$healthy" != "1" ]]; then
            docker logs qadiya-ci
            exit 1
          fi

          cat /tmp/qadiya-health.json
          grep -q "$GITHUB_SHA" /tmp/qadiya-health.json
          curl --fail --silent http://127.0.0.1:2567/ > /dev/null
          curl --fail --silent http://127.0.0.1:2567/api/build | grep -q "$GITHUB_SHA"
